<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感谢肖瑶老师</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-start: #f2f8f0;
    --bg-mid:   #eef7e9;
    --bg-end:   #e4f0df;
    --accent:   #5c7a5e;
    --accent-light: #7a9e7c;
    --text:     #2e3d2e;
    --text-soft: #5b6e5b;
    --frost-bg:  rgba(248, 252, 247, 0.5);
    --frost-border: rgba(210, 230, 205, 0.55);
    --photo-frame: #f8faf6;
    --photo-shadow: 0 5px 20px rgba(30, 60, 20, 0.12), 0 1px 3px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', serif;
    background: linear-gradient(165deg, var(--bg-start) 0%, var(--bg-mid) 40%, var(--bg-end) 100%);
    min-height: 100vh; overflow-x: hidden; color: var(--text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  #particles-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  .glow-orb {
    position: fixed; border-radius: 50%; filter: blur(130px);
    pointer-events: none; z-index: 0; opacity: 0.25;
    animation: breathe 10s ease-in-out infinite;
  }
  .glow-orb.orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(170,210,160,0.35), transparent);
    top: -10%; left: -8%; animation-delay: 0s;
  }
  .glow-orb.orb-2 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(185,220,175,0.3), transparent);
    bottom: -8%; right: -6%; animation-delay: -5s;
  }
  .glow-orb.orb-3 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(195,225,185,0.28), transparent);
    top: 42%; left: 55%; animation-delay: -2s;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.25; }
    50%      { transform: scale(1.2); opacity: 0.38; }
  }

  #photo-wall {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
  }

  .photo-card {
    position: absolute;
    background: var(--photo-frame);
    padding: 8px 8px 34px 8px;
    box-shadow: var(--photo-shadow);
    border-radius: 3px;
    opacity: 0;
    transition: none;
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 1;
  }
  .photo-card.placed { opacity: 1; }
  .photo-card img { display: block; width: 100%; height: auto; border-radius: 1px; }
  .photo-card::after {
    content: ''; position: absolute; bottom: 7px; left: 50%;
    transform: translateX(-50%); width: 65%; height: 1px;
    background: rgba(0,0,0,0.05);
  }

  /* 中心卡片 — 克制优雅 */
  #center-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    border: 1px solid var(--frost-border);
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(80,100,70,0.12), 0 0 60px rgba(170,190,160,0.08);
    text-align: center;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 0.6s ease;
    overflow: visible;
    pointer-events: none;
  }
  /* 背景图片层 — 大幅居中，包裹故事框 */
  #center-card .memory-bg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 8;
    width: 55vw; max-width: 700px;
    height: auto;
    object-fit: contain;
    opacity: 0;
    filter: blur(1px);
    border: 3px solid rgba(255,255,255,0.7);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(40,55,25,0.15);
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  @media (max-width: 640px) {
    #center-card .memory-bg { width: 80vw; }
  }

  /* 文字层（frost overlay） */
  #center-card .memory-overlay {
    position: relative; z-index: 1;
    background: var(--frost-bg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: 18px;
    padding: 44px 56px;
  }

  #center-card .memory-title {
    font-size: clamp(1.3rem, 3.2vw, 1.95rem);
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.1em;
    line-height: 1.8;
    margin-bottom: 4px;
    animation: text-fade-in 1.4s ease-out forwards;
    opacity: 0;
  }
  #center-card .memory-sub {
    font-size: clamp(0.88rem, 1.6vw, 1.05rem);
    font-weight: 300;
    color: var(--text-soft);
    letter-spacing: 0.14em;
    animation: text-fade-in 1.4s 0.3s ease-out forwards;
    opacity: 0;
  }
  @keyframes text-fade-in {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }


  /* 成果展示卡片 */
  #achievement-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    background: var(--frost-bg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--frost-border);
    border-radius: 18px;
    padding: 40px 48px 32px 48px;
    box-shadow: 0 16px 48px rgba(80,100,70,0.12), 0 0 60px rgba(170,190,160,0.08);
    text-align: center;
    max-width: 88vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #achievement-card .ach-img {
    display: block; margin: 0 auto 20px auto;
    max-width: 55vw; max-height: 42vh;
    border: 3px solid rgba(255,255,255,0.8);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(40,55,25,0.12);
    object-fit: contain;
  }
  #achievement-card .ach-text {
    font-size: clamp(1.2rem, 2.8vw, 1.75rem);
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.1em;
    line-height: 1.6;
  }

  /* 回忆轮播切换动画 */
  #center-card.switching { opacity: 0; transform: translate(-50%, -50%) translateY(6px); }

  /* 最终致谢卡片 */
  #final-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    background: var(--frost-bg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--frost-border);
    border-radius: 18px;
    padding: 56px 64px;
    box-shadow: 0 20px 60px rgba(80,100,70,0.14), 0 0 80px rgba(170,190,160,0.1);
    text-align: center;
    max-width: 88vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.5s ease;
  }
  #final-card.show { opacity: 1; }
  #final-card h2 {
    font-size: clamp(1.5rem, 3.8vw, 2.3rem);
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.12em;
    line-height: 1.9;
    margin-bottom: 8px;
  }
  #final-card .date {
    font-size: clamp(0.85rem, 1.4vw, 0.95rem);
    font-weight: 300;
    color: var(--text-soft);
    letter-spacing: 0.16em;
    margin-top: 12px;
  }

  /* 音乐按钮 */
  #music-btn {
    position: fixed; bottom: 32px; right: 32px; z-index: 100;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--frost-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(175,200,170,0.45);
    box-shadow: 0 2px 10px rgba(40,60,30,0.06);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  #music-btn:hover { box-shadow: 0 6px 20px rgba(40,60,30,0.1); transform: scale(1.05); }
  #music-btn:active { transform: scale(0.94); }
  #music-btn svg { width: 19px; height: 19px; }
  #music-btn.muted .icon-play { display: none; }
  #music-btn:not(.muted) .icon-mute { display: none; }
  #music-btn .icon-play path, #music-btn .icon-mute path { fill: var(--text-soft); }

  #music-btn::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid rgba(140,180,140,0.25);
    animation: music-ring 2.5s ease-out infinite; opacity: 0;
  }
  #music-btn:not(.muted)::after { opacity: 1; }
  @keyframes music-ring {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  #footer-hint {
    position: fixed; bottom: 38px; left: 50%; transform: translateX(-50%);
    z-index: 5; font-size: 0.75rem; color: var(--text-soft);
    font-weight: 300; letter-spacing: 0.12em;
    opacity: 0.4; pointer-events: none; transition: opacity 0.8s;
  }

  @media (max-width: 640px) {
    #center-card { padding: 32px 28px; border-radius: 14px; }
    #final-card { padding: 40px 32px; border-radius: 14px; }
    #music-btn { bottom: 20px; right: 20px; width: 38px; height: 38px; }
    #music-btn svg { width: 15px; height: 15px; }
    .photo-card { padding: 6px 6px 26px 6px; }
  }
</style>
</head>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>
<canvas id="particles-canvas"></canvas>
<div id="photo-wall"></div>

<!-- 中心卡片（毛玻璃）— 回忆文案轮播 -->
<div id="center-card">

  <div class="memory-overlay">

    <div class="memory-sub" id="mem-sub"></div>

</div>

<!-- 成果展示卡片 -->

</div>

<!-- 最终致谢卡片 -->

  <h2 id="final-text"></h2>

<div id="footer-hint">回忆正在翻阅…</div>

  <svg class="icon-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
</button>

<script>
/* ============================================
   配置区域
   ============================================ */
const CONFIG = {
  photos: [
    '1.png',  '2.png',  '3.png',  '4.png',  '5.png',
    '6.png',  '7.png',  '8.png',  '9.png',  '10.png',
    '11.png', '12.png', '13.png', '14.png', '15.png',
    '16.jpg', '17.jpg', '18.jpg', '19.png', '20.png',
    '21.png', '22.png', '23.png',
  ],
  singleCycle: true,              // 只播放一次，不循环
  musicSrc: 'laosbo.mp3?v=20260611',
  photoInterval: 188,
  layerPause: 3500,
  totalLayers: 3,                // 3层，共60张
  finalDisplay: 5000,            // 照片墙最终停留
  fadeDuration: 3000,
  pauseBetweenCycles: 4000,
  musicVolume: 0.4,
  musicFadeEnd: 0.14,            // 最终音量 ~35%
  photoMinWidth: 220,
  photoMaxWidth: 380,
  rotationRange: 20,
};

/* ============================================
   回忆文案轮播
   ============================================ */
const MEMORIES = [
  {
    title: '点灯大师',
    sub: '第一次问你怎么入门单片机，你说先当好"点灯大师"。随后发了两个淘宝链接过来，补了一句——"不要想着一次性把所有模块实现，先能跑就行。"',
    bg: '1.png',
  },
  {
    title: '502粘住的板子',
    sub: '第一次焊接，把单片机用502粘死了。你说："刚开始都是焊的一团乱麻，我这块也很丑。" 没有安慰的套话，却让人一下子明白——搞砸了没关系，再来。',
    bg: '2.png',
  },
  {
    title: '路上聊天',
    sub: '周五下课后，偶尔会一起往食堂走。你会聊自己的成长经历，也会问我的近况。聊到比赛、考研和未来规划时，总会补上一句："需要帮助就来找我。"',
    bg: '3.png',
  },
  {
    title: '松香',
    sub: '焊锡烧到300度也没化。你发来松香的照片，说："这个应该有的。" 第二天课间就在教室门口递了一盒过来。你答应的事情，从不拖到下次。',
    bg: '4.png',
  },
  {
    title: '带个墨镜',
    sub: '拼接灯太亮了，你说"上次眼就被闪花了，得带个墨镜看"。逗得我笑了半天',
    bg: '5.jpg',
  },
  {
    title: '轮子飞了',
    sub: '小车第一次下地，右轮直接飞了出去。你笑了半天，然后对着屏幕打字：后退的逻辑写错了，转弯的延迟也不对。后来修好了，你说"执行力杠杠的"。',
    bg: '6.png',
  },
  {
    title: '等你到四点',
    sub: '你三点十五下课，发消息说："最迟等你到四点。" 为了赶过去，我匆匆结束手上的事情跑去见你。就为了看一辆电容刚炸过、还没完全调好的小车。离开前，你又认真提了几条改进建议。',
    bg: '7.png',
  },
  {
    title: '车上的电烙铁',
    sub: '从办公室走到停车位的几百米，我们聊起学院拍摄的视频、网上对理想车主的刻板印象，还有最近发生的各种趣事。说到总被认成学生时，你自己都笑了。走着走着，停车场好像比平时近了不少。',
    bg: '8.png',
  },
];
const MEMORY_SWITCH_INTERVAL = 5000; // 5秒切换

(function initMemories() {
  const titleEl = document.getElementById('mem-title');
  const subEl   = document.getElementById('mem-sub');
  const bgEl    = document.getElementById('mem-bg');
  const card    = document.getElementById('center-card');
  const hint    = document.getElementById('footer-hint');
  let idx = 0;
  let timer = null;
  let running = false;          // 初始 false，由 restartCarousel 启动
  let cycleCompleted = false;
  window.isCarouselRunning = function() { return running; };
  window.isCycleCompleted  = function() { return cycleCompleted; };
  let memoryShown = new Set();

  function showMemory(i) {
    const m = MEMORIES[i];
    titleEl.textContent = m.title;
    subEl.textContent   = m.sub;

    // 背景图切换
    const newBg = m.bg || '';
    if (bgEl.dataset.current !== newBg) {
      // 淡出
      bgEl.style.transition = 'opacity 0.4s ease';
      bgEl.style.opacity = '0';
      setTimeout(function() {
        if (newBg) {
          bgEl.src = newBg;
          bgEl.style.display = '';
        } else {
          bgEl.src = '';
          bgEl.style.display = 'none';
        }
        bgEl.dataset.current = newBg;
        // 强制 reflow 确保浏览器渲染 opacity:0 后，再淡入
        bgEl.offsetHeight;
        bgEl.style.opacity = '0.32';
      }, 450);
    }

    // 追踪已展示的 MEMORY，全部出现一次即为完整一轮
    memoryShown.add(i);
    if (memoryShown.size >= MEMORIES.length && !cycleCompleted) {
      cycleCompleted = true;
      if (timer) { clearInterval(timer); timer = null; }  // 停轮播，不让它绕回点灯大师
      console.log('[MEMORIES] 完整播放一轮，停轮播，准备淡入致谢');
    }

    // 重播入场动画
    titleEl.style.animation = 'none';
    subEl.style.animation = 'none';
    titleEl.offsetHeight;
    subEl.offsetHeight;
    titleEl.style.animation = 'text-fade-in 1.4s ease-out forwards';
    subEl.style.animation   = 'text-fade-in 1.4s 0.3s ease-out forwards';
    titleEl.style.opacity = '0';
    subEl.style.opacity = '0';
    setTimeout(function() { titleEl.style.opacity = ''; subEl.style.opacity = ''; }, 2000);
  }

  function startCarousel() {
    showMemory(0);
    idx = 0;
    timer = setInterval(() => {
      idx = (idx + 1) % MEMORIES.length;
      showMemory(idx);
    }, MEMORY_SWITCH_INTERVAL);
  }

  function stopCarousel() {
    running = false;
    if (timer) { clearInterval(timer); timer = null; }
  }

  function restartCarousel() {
    if (running) return;
    running = true;
    idx = 0;
    cycleCompleted = false;
    memoryShown = new Set();
    // 显示中心卡片
    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    card.style.opacity = '1';
    card.style.transform = 'translate(-50%, -50%) translateY(0)';
    card.style.pointerEvents = '';
    showMemory(0);
    timer = setInterval(() => {
      idx = (idx + 1) % MEMORIES.length;
      showMemory(idx);
    }, MEMORY_SWITCH_INTERVAL);
  }

  // 最终致谢时隐藏轮播卡片
  window.showFinalCard = function() {
    stopCarousel();
    card.style.transition = 'opacity 1.5s ease, transform 1.5s ease';
    card.style.opacity = '0';
    card.style.transform = 'translate(-50%, -50%) translateY(-10px)';
    hint.style.opacity = '0';
  };

  window.restartCarousel = restartCarousel;

  // 延迟启动：等待照片墙完成后由 runLayers 触发
  // startCarousel() 会在成果展示页之后调用
})();

/* ============================================
   粒子系统（克制版）
   ============================================ */
(function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const MAX = 28;
  let w, h;

  function resize() {
    w = canvas.width  = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(true); }
    reset(init) {
      this.x = Math.random() * w;
      this.y = init ? Math.random() * h : h + 15;
      this.r = Math.random() * 1.8 + 0.6;
      this.opacity = Math.random() * 0.3 + 0.08;
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = -(Math.random() * 0.3 + 0.1);
      this.life = 0;
      this.maxLife = 500 + Math.random() * 600;
      this.hue = Math.random() < 0.5 ? '160,200,160' : '190,215,180';
    }
    update() {
      this.x += this.vx; this.y += this.vy; this.life++;
      if (this.life > this.maxLife || this.y < -15) this.reset(false);
    }
    draw() {
      const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * this.opacity;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.hue},${alpha})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < MAX; i++) particles.push(new Particle());
  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ============================================
   照片墙 — 3层，随机序，四周飞入
   ============================================ */
(function initPhotoWall() {
  const wall = document.getElementById('photo-wall');
  const hint = document.getElementById('footer-hint');
  const finalCard = document.getElementById('final-card');
  const finalText = document.getElementById('final-text');
  const finalDate = document.getElementById('final-date');
  const rand = (min, max) => Math.random() * (max - min) + min;

  let loadedPhotos = [];
  let allCards = [];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function preloadAll() {
    const promises = CONFIG.photos.map((src) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ src, img, ok: true });
        img.onerror = () => { console.warn('Photo not found:', src); resolve({ src, img: null, ok: false }); };
        img.src = src;
      });
    });
    const results = await Promise.all(promises);
    return results.filter(r => r.ok);
  }

  function computeLayout(photos) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const centerCX = vw / 2;
    const centerCY = vh / 2;
    const centerSafeW = vw * 0.16;
    const centerSafeH = vh * 0.1;

    const zones = [
      { yMin: -5, yMax: vh * 0.28 },
      { yMin: vh * 0.18, yMax: vh * 0.52 },
      { yMin: vh * 0.42, yMax: vh * 0.78 },
      { yMin: vh * 0.65, yMax: vh + 5 },
    ];

    return photos.map((p, i) => {
      const ratio = p.img.naturalWidth / p.img.naturalHeight;
      const photoW = rand(CONFIG.photoMinWidth, CONFIG.photoMaxWidth);
      const photoH = photoW / ratio;
      const zone = zones[i % 4];
      let cx, cy;
      let attempts = 0;
      do {
        cx = rand(-5, vw + 5);
        cy = rand(zone.yMin, zone.yMax);
        attempts++;
      } while (
        attempts < 15 &&
        Math.abs(cx - centerCX) < centerSafeW * 0.5 &&
        Math.abs(cy - centerCY) < centerSafeH * 0.5
      );
      const rotate = rand(-CONFIG.rotationRange, CONFIG.rotationRange);
      const dir = Math.random();
      let startX, startY;
      if (dir < 0.25)      { startX = rand(-vw * 0.45, -120);   startY = rand(-100, vh + 100); }
      else if (dir < 0.5)  { startX = rand(vw + 120, vw * 1.45); startY = rand(-100, vh + 100); }
      else if (dir < 0.75) { startX = rand(-100, vw + 100);     startY = rand(-vh * 0.45, -120); }
      else                 { startX = rand(-100, vw + 100);     startY = rand(vh + 120, vh * 1.45); }
      return { ...p, cx, cy, width: photoW, height: photoH, rotate, startX, startY };
    });
  }

  function createCards(layout) {
    return layout.map((item) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.style.width  = item.width + 'px';
      card.style.height = (item.height + 34) + 'px';
      card.style.left   = '0px';
      card.style.top    = '0px';
      card.style.transform = `translate(${item.startX}px, ${item.startY}px) rotate(${item.rotate * 2}deg) scale(0.15)`;
      const imgEl = document.createElement('img');
      imgEl.src = item.src;
      imgEl.alt = '回忆照片';
      imgEl.style.width  = item.width + 'px';
      imgEl.style.height = item.height + 'px';
      card.appendChild(imgEl);
      card._target = { cx: item.cx, cy: item.cy, rotate: item.rotate };
      wall.appendChild(card);
      return card;
    });
  }

  function flyIn(card, delay, duration) {
    return new Promise((resolve) => {
      const t = card._target;
      const dur = duration || 0.7;
      card.style.opacity = '0';
      setTimeout(() => {
        card.style.transition =
          `transform ${dur}s cubic-bezier(0.25, 1.8, 0.5, 1), opacity 0.3s ease-out`;
        card.style.transform =
          `translate(${t.cx}px, ${t.cy}px) rotate(${t.rotate}deg) scale(1)`;
        card.style.opacity = '1';
        const onDone = () => {
          card.removeEventListener('transitionend', onDone);
          card.classList.add('placed');
          resolve();
        };
        card.addEventListener('transitionend', onDone);
        setTimeout(() => {
          if (!card.classList.contains('placed')) { card.classList.add('placed'); resolve(); }
        }, dur * 1000 + 300);
      }, delay);
    });
  }

  // 音乐渐弱
  function fadeMusic(duration) {
    const audio = document.getElementById('bg-music');
    if (!audio || audio.paused) return;
    const startVol = audio.volume;
    const endVol = CONFIG.musicFadeEnd;
    const steps = 30;
    const stepTime = duration / steps;
    const delta = (startVol - endVol) / steps;
    let step = 0;
    const iv = setInterval(() => {
      step++;
      audio.volume = Math.max(endVol, startVol - delta * step);
      if (step >= steps) clearInterval(iv);
    }, stepTime);
  }

  // 成果展示
  async function showAchievement() {
    const achCard = document.getElementById('achievement-card');
    achCard.style.transition = 'opacity 1.2s ease';
    achCard.style.opacity = '1';
    await new Promise(r => setTimeout(r, 5000));
  }

  // 隐藏成果展示
  function hideAchievement() {
    const achCard = document.getElementById('achievement-card');
    achCard.style.transition = 'opacity 0.6s ease';
    achCard.style.opacity = '0';
  }

  // 最终致谢
  async function showFinal() {
    finalText.innerHTML = '感谢肖瑶老师<br><br>从点不亮的LED到跑起来的小车，<br>从粘废的板子到焊整齐的电路。<br><br>松香、电烙铁、停车位、深夜消息——<br>都会记得。';
    finalDate.textContent = '2026.06';
    finalCard.classList.add('show');

    // 音乐渐弱 4秒
    fadeMusic(4000);

    await new Promise(r => setTimeout(r, 10000));

    // 最终淡出全部
    finalCard.style.transition = 'opacity 2.5s ease';
    finalCard.style.opacity = '0';
    await new Promise(r => setTimeout(r, 3000));
  }

  async function runLayers(photos) {
    for (let layer = 0; layer < CONFIG.totalLayers; layer++) {
      const shuffled = shuffle(photos);
      const layout = computeLayout(shuffled);
      const cards = createCards(layout);
      allCards.push(...cards);

      const promises = cards.map((card) => {
        const randDelay = Math.random() * 120;
        const randDuration = 0.5 + Math.random() * 0.8;
        return flyIn(card, randDelay, randDuration);
      });
      await Promise.all(promises);

      hint.textContent = layer === CONFIG.totalLayers - 1
        ? '回忆已经满溢…'
        : '回忆正在累积…';
      hint.style.opacity = '0.35';

      await new Promise(r => setTimeout(r, CONFIG.layerPause));
    }

    hint.textContent = '回忆已经满溢…';
    hint.style.opacity = '0.35';

    // === 照片展示 3s ===
    await new Promise(r => setTimeout(r, 3000));

    // === 照片淡出 ===
    hint.style.opacity = '0';
    allCards.forEach(c => {
      c.style.transition = `opacity ${CONFIG.fadeDuration}ms ease-in`;
      c.style.opacity = '0';
    });
    await new Promise(r => setTimeout(r, CONFIG.fadeDuration + 800));
    wall.innerHTML = '';
    allCards = [];

    // === 成果展示页 ===
    await showAchievement();
    hideAchievement();

    // === 显示中心卡片，启动 MEMORIES 轮播 ===
    const cardEl = document.getElementById('center-card');
    cardEl.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    cardEl.style.opacity = '1';
    cardEl.style.transform = 'translate(-50%, -50%) translateY(0)';
    cardEl.style.pointerEvents = '';
    window.restartCarousel();

    // === 等待 MEMORIES 完整播放 ===
    const carouselNeeded = MEMORIES.length * MEMORY_SWITCH_INTERVAL;
    console.log('[PHOTOWALL] 等待 MEMORIES 完整播放，约', Math.round(carouselNeeded/1000), '秒');
    const startWait = Date.now();
    while (!window.isCycleCompleted() && (Date.now() - startWait) < carouselNeeded + 8000) {
      await new Promise(r => setTimeout(r, 500));
    }

    // === 等待最后一段故事完整展示 5s ===
    await new Promise(r => setTimeout(r, MEMORY_SWITCH_INTERVAL + 500));

    // === 隐藏中心卡片，进入最终致谢 ===
    window.showFinalCard();
    await new Promise(r => setTimeout(r, 1500));

    await showFinal();

    // 内容结束提示
    hint.textContent = '— 感谢观看 —';
    hint.style.opacity = '0.85';
    hint.style.fontSize = '1.05rem';
    hint.style.fontWeight = '400';
    hint.style.letterSpacing = '0.16em';
    hint.style.color = 'var(--accent)';
    hint.style.transition = 'opacity 1.5s ease';
    // 故事结束，不循环
  }

  async function mainLoop() {
    const photos = await preloadAll();
    if (photos.length === 0) { hint.textContent = '暂无照片'; return; }
    loadedPhotos = photos;

    // 只播放一次
    await runLayers(loadedPhotos);
  }

  mainLoop();
})();

/* ============================================
   音乐控制
   ============================================ */
(function initMusic() {
  const audio = document.getElementById('bg-music');
  const btn   = document.getElementById('music-btn');
  let started = false;

  audio.volume = CONFIG.musicVolume;
  audio.loop = true;

  // 激进自动播放：先尝试直接播放
 (function initMusic() {

    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');

    let started = false;

    audio.load();
    audio.volume = CONFIG.musicVolume;
    audio.loop = true;

    function updateButton(isPlaying) {
      if (isPlaying) {
        btn.classList.remove('muted');
        btn.title = '暂停音乐';
      } else {
        btn.classList.add('muted');
        btn.title = '播放音乐';
      }
    }

    function forcePlay() {

      const playPromise = audio.play();

      if (playPromise !== undefined) {

        playPromise.then(() => {

          started = true;

          updateButton(true);

          console.log("音乐播放成功");

        }).catch((err) => {

          console.log("自动播放被浏览器拦截", err);

          updateButton(false);

        });

      }
    }

    // 先尝试自动播放
    forcePlay();

    // 安卓 / 手机首次触摸时启动音乐
    function unlockAudio() {

      if (!started) {

        forcePlay();

      }

      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    }

    document.addEventListener('touchstart', unlockAudio, { once: true });

    document.addEventListener('click', unlockAudio, { once: true });

    document.addEventListener('keydown', unlockAudio, { once: true });

    // 音乐按钮
    btn.addEventListener('click', function (e) {

      e.stopPropagation();

      if (audio.paused) {

        audio.play().then(() => {

          started = true;

          updateButton(true);

        }).catch(err => {

          console.log(err);

        });

      } else {

        audio.pause();

        updateButton(false);

      }

    });

    // 页面重新可见时恢复播放
    document.addEventListener('visibilitychange', function () {

      if (!document.hidden && started && audio.paused) {

        audio.play().catch(() => { });

      }

    });

  })();
  forcePlay();

  // 首次任意交互即启动音乐
  function onInteract() {
    if (!started) {
      forcePlay();
    }
    if (started) {
      document.removeEventListener('click', onInteract);
      document.removeEventListener('touchstart', onInteract);
      document.removeEventListener('keydown', onInteract);
    }
  }
  document.addEventListener('click', onInteract);
  document.addEventListener('touchstart', onInteract);
  document.addEventListener('keydown', onInteract);

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.paused) {
      audio.play().then(() => {
        started = true;
        btn.classList.remove('muted');
        btn.title = '暂停音乐';
      }).catch(() => {});
    } else {
      audio.pause();
      btn.classList.add('muted');
      btn.title = '播放音乐';
    }
  });
})();

console.log('🌸 感谢肖瑶老师 — 纪念册已就绪');
</script>
